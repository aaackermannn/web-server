<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="connectionPage" class="page">
        <div class="container">
            <div class="card">
                <h1>Подключение к чату</h1>
                <form id="connectionForm">
                    <div class="form-group">
                        <label for="username">Имя пользователя:</label>
                        <input type="text" id="username" name="username" required maxlength="20" placeholder="Введите ваше имя">
                    </div>
                    <div class="form-group">
                        <label for="roomSelect">Выберите комнату:</label>
                        <select id="roomSelect" name="roomSelect">
                            <option value="general">Общий чат</option>
                            <option value="gaming">Игры</option>
                            <option value="tech">Технологии</option>
                            <option value="custom">Создать свою комнату</option>
                        </select>
                    </div>
                    <div class="form-group" id="customRoomGroup" style="display: none;">
                        <label for="customRoom">Название комнаты:</label>
                        <input type="text" id="customRoom" name="customRoom" maxlength="30" placeholder="Введите название комнаты">
                    </div>
                    <button type="submit" id="connectBtn">Подключиться</button>
                </form>
                <div id="availableRooms">
                    <h3>Доступные комнаты:</h3>
                    <div id="roomsList"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="chatPage" class="page" style="display: none;">
        <div class="chat-container">
            <div class="chat-header">
                <h2 id="roomTitle">Комната</h2>
                <div class="connection-status">
                    <span id="statusIndicator" class="status-disconnected"></span>
                    <span id="statusText">Отключен</span>
                </div>
            </div>
            
            <div class="chat-content">
                <div class="users-panel">
                    <h3>Участники (<span id="userCount">0</span>)</h3>
                    <div id="usersList" class="users-list"></div>
                </div>
                
                <div class="chat-main">
                    <div id="messagesContainer" class="messages-container"></div>
                    
                    <div class="message-input-container">
                        <form id="messageForm">
                            <input type="text" id="messageInput" placeholder="Введите сообщение..." maxlength="500">
                            <button type="submit" id="sendBtn">Отправить</button>
                        </form>
                        <div class="message-info">
                            <span id="charCount">0/500</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
